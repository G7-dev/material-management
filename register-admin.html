<!DOCTYPE html>
<html>
<head>
  <title>注册管理员</title>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f7fa;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4f46e5;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background: #d1fae5;
      color: #065f46;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
    .info {
      background: #dbeafe;
      color: #1e40af;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 注册管理员账号</h1>
    
    <div class="info">
      <strong>说明：</strong>请先登录管理员账号，然后在此页面创建新管理员。
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>当前管理员邮箱</label>
        <input type="email" id="adminEmail" required placeholder="your@email.com">
      </div>
      
      <div class="form-group">
        <label>当前管理员密码</label>
        <input type="password" id="adminPassword" required placeholder="输入当前管理员密码">
      </div>
      
      <div class="form-group">
        <label>新管理员姓名</label>
        <input type="text" id="newName" value="李红" readonly>
      </div>
      
      <div class="form-group">
        <label>新管理员邮箱</label>
        <input type="email" id="newEmail" value="lihong@company.com" required placeholder="lihong@company.com">
      </div>
      
      <div class="form-group">
        <label>新管理员密码</label>
        <input type="text" id="newPassword" value="jyyl123456" readonly>
      </div>
      
      <div class="form-group">
        <label>部门（可选）</label>
        <input type="text" id="department" placeholder="管理层">
      </div>

      <button type="submit" id="submitBtn">创建管理员账号</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabaseUrl = 'https://urqhhixldzhqauvafktq.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycWhoaXhsZHpocWF1dmFma3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTA4MzMsImV4cCI6MjA4OTI2NjgzM30.5Wa62K3yR1V5Za31OhGhgJIkaihhfJhY2awladof-qM';

    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');
      
      submitBtn.disabled = true;
      submitBtn.textContent = '创建中...';
      resultDiv.style.display = 'none';

      try {
        const adminEmail = document.getElementById('adminEmail').value;
        const adminPassword = document.getElementById('adminPassword').value;
        const newEmail = document.getElementById('newEmail').value;
        const newName = document.getElementById('newName').value;
        const newPassword = document.getElementById('newPassword').value;
        const department = document.getElementById('department').value;

        // 1. 登录当前管理员
        console.log('🔐 正在登录当前管理员...');
        const { data: { session }, error: loginError } = await supabase.auth.signInWithPassword({
          email: adminEmail,
          password: adminPassword
        });

        if (loginError || !session) {
          throw new Error(loginError?.message || '登录失败');
        }

        console.log('✅ 登录成功');

        // 2. 调用 Edge Function 创建新管理员
        console.log('👤 正在创建新管理员...');
        const response = await fetch(`${supabaseUrl}/functions/v1/admin-create-user`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({
            email: newEmail,
            password: newPassword,
            full_name: newName,
            role: 'admin',
            department: department || '管理层',
          }),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || `创建失败: ${response.status}`);
        }

        // 3. 登出
        await supabase.auth.signOut();

        // 4. 显示成功消息
        resultDiv.className = 'result success';
        resultDiv.innerHTML = `
          <strong>🎉 管理员账号创建成功！</strong><br><br>
          <strong>用户ID:</strong> ${result.userId}<br>
          <strong>邮箱:</strong> ${result.email}<br>
          <strong>姓名:</strong> ${newName}<br><br>
          <strong>首次登录后需要修改密码</strong>
        `;
        resultDiv.style.display = 'block';

      } catch (error) {
        console.error('❌ 创建失败:', error);
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<strong>创建失败:</strong> ${error.message}`;
        resultDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '创建管理员账号';
      }
    });
  </script>
</body>
</html>
